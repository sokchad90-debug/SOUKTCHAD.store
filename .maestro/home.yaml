appId: com.anonymous.sokchadapp
---
# Home regression suite v8.9.32 — uses testIDs (no reliance on legacy placeholder text)
- launchApp:
    appId: com.anonymous.sokchadapp
    clearState: false
- waitForAnimationToEnd:
    timeout: 10000

# Mandatory assertions (real elements, by testID)
- assertVisible:
    id: "home-search-input"
- assertVisible:
    id: "home-categories"
- assertVisible: "Boutiques vérifiées"
- assertVisible: "Sponsorisé"
- assertVisible: "Nouveautés"
- assertVisible:
    id: "home-products-list"

- takeScreenshot: home_v8932_top_fr

# Scroll to the bottom: last card must be reachable and fully visible
- swipe:
    from:
      id: "home-products-list"
    direction: DOWN
- swipe:
    from:
      id: "home-products-list"
    direction: DOWN
- swipe:
    from:
      id: "home-products-list"
    direction: DOWN
- swipe:
    from:
      id: "home-products-list"
    direction: DOWN
- swipe:
    from:
      id: "home-products-list"
    direction: DOWN
- swipe:
    from:
      id: "home-products-list"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: home_v8932_end_fr
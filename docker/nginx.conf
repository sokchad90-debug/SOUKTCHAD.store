# Sokchad — Nginx Configuration
# Serves PHP API on port 80

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide server identity
    server_tokens off;

    # Disable directory listing
    autoindex off;

    # Max upload size (50MB for product images)
    client_max_body_size 50M;

    # Block access to sensitive files
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    location ~ \.(sql|bak|backup|log|ini)$ {
        deny all;
        return 404;
    }

    # Block config.php direct access
    location ~ /config/ {
        deny all;
        return 404;
    }

    # Health check endpoint
    location = /health.php {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # PHP API endpoints — all .php files
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS off;
    }

    # Uploads — serve static files
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Block access to schema.sql
    location = /schema.sql {
        deny all;
        return 404;
    }

    # Default — try static files, then 404
    location / {
        try_files $uri $uri/ =404;
    }
}